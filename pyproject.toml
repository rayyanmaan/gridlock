[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "gridlock"
version = "1.0.0"
description = "Agent-based traffic simulation on real city street networks, and a test of whether road-network topology alone predicts congestion."
readme = "README.md"
requires-python = ">=3.9"
license = { file = "LICENSE" }
authors = [{ name = "Rayyan Maan" }]
keywords = [
    "traffic-simulation",
    "cellular-automaton",
    "nagel-schreckenberg",
    "openstreetmap",
    "complex-systems",
    "network-science",
    "betweenness-centrality",
    "agent-based-model",
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Visualization",
]
dependencies = [
    "osmnx>=1.9",
    "networkx>=3.0",
    "numpy>=1.24",
    "pandas>=2.0",
    "scipy>=1.10",
    "matplotlib>=3.7",
    "seaborn>=0.12",
]

[project.urls]
Homepage = "https://github.com/rayyanmaan/traffic-bottleneck-prediction"
Repository = "https://github.com/rayyanmaan/traffic-bottleneck-prediction"

[tool.setuptools]
packages = ["gridlock"]
